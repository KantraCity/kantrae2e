syntax = "proto3";

package kantra.auth.v1;

// Service-to-service API. Not routed by the gateway; authenticated with the
// shared INTERNAL_TOKEN ("Authorization: Internal <token>").
service AuthInternalService {
  // Which of the given devices exist and are not revoked, and which of
  // those are approved.
  rpc DeviceStatus(DeviceStatusRequest) returns (DeviceStatusResponse) {}
  // Whether either of two users has blocked the other.
  rpc Blocked(BlockedRequest) returns (BlockedResponse) {}
}

message BlockedRequest {
  string user_a = 1;
  string user_b = 2;
}

message BlockedResponse {
  bool blocked = 1;
}

message DeviceStatusRequest {
  repeated string device_ids = 1;
}

message DeviceStatusResponse {
  repeated string active_device_ids = 1;
  // Subset of active devices that have been approved (not pending).
  repeated string approved_device_ids = 2;
}
