syntax = "proto3";

package kantra.auth.v1;

// Accounts, sessions and devices.
// Register and Login are the only unauthenticated RPCs.
service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
  rpc Login(LoginRequest) returns (LoginResponse) {}
  // Registers a new device for the caller and returns a device-bound token.
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse) {}
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {}
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse) {}
  // Resolves a username to a user id or vice versa.
  rpc LookupUser(LookupUserRequest) returns (LookupUserResponse) {}
  // Exchanges a valid token for a fresh one. Fails for revoked devices.
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {}

  // --- Device linking and recovery ---
  // Status of the calling device and account.
  rpc GetAccountStatus(GetAccountStatusRequest) returns (GetAccountStatusResponse) {}
  // An approved device approves a pending device of the same account.
  rpc ApproveDevice(ApproveDeviceRequest) returns (ApproveDeviceResponse) {}
  // Stores the recovery verifier and the history key wrapped with the
  // recovery key (both computed on the client; the server never sees the
  // recovery key or the history key). Approved devices only.
  rpc SetRecovery(SetRecoveryRequest) returns (SetRecoveryResponse) {}
  // Proves knowledge of the recovery key: approves the calling device and
  // returns the wrapped history key.
  rpc Recover(RecoverRequest) returns (RecoverResponse) {}
  // Username prefix search (to start a direct chat).
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse) {}

  // --- Public profile (like Telegram: visible to everyone) ---
  // Profiles of several users (clients cache them, avatar by avatar_id).
  rpc GetProfiles(GetProfilesRequest) returns (GetProfilesResponse) {}
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {}
  // Changes the caller's @username (unique, case-insensitive).
  rpc SetUsername(SetUsernameRequest) returns (SetUsernameResponse) {}
  // Sets (or with empty image removes) the caller's profile photo (JPEG/PNG/WebP, <= 512 KiB).
  rpc SetAvatar(SetAvatarRequest) returns (SetAvatarResponse) {}
  rpc GetAvatar(GetAvatarRequest) returns (GetAvatarResponse) {}
  // Calls: STUN/TURN servers for WebRTC with short-lived TURN credentials
  // (the server relays encrypted media only; it never has the keys).
  rpc GetIceServers(GetIceServersRequest) returns (GetIceServersResponse) {}
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  // Display name ("first last"); defaults to the username.
  string display_name = 3;
}

message RegisterResponse {
  string user_id = 1;
  // Account-level JWT (no device claim).
  string token = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  // Optional: an existing, non-revoked device of this user. When set the
  // returned token is bound to this device.
  string device_id = 3;
}

message LoginResponse {
  string user_id = 1;
  string token = 2;
}

message RegisterDeviceRequest {
  string device_name = 1;
}

message RegisterDeviceResponse {
  string device_id = 1;
  // JWT bound to the new device.
  string token = 2;
}

message Device {
  string id = 1;
  string device_name = 2;
  int64 created_at = 3;
  // 0 when active.
  int64 revoked_at = 4;
  // Pending devices must be approved by another device or the recovery key.
  bool approved = 5;
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message RevokeDeviceRequest {
  string device_id = 1;
}

message RevokeDeviceResponse {}

message LookupUserRequest {
  // Exactly one of username / user_id.
  string username = 1;
  string user_id = 2;
}

message LookupUserResponse {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string bio = 4;
  string avatar_id = 5;
}

message RefreshTokenRequest {}

message RefreshTokenResponse {
  string token = 1;
}

message GetAccountStatusRequest {}

message GetAccountStatusResponse {
  bool device_approved = 1;
  bool has_recovery = 2;
}

message ApproveDeviceRequest {
  string device_id = 1;
}

message ApproveDeviceResponse {}

message SetRecoveryRequest {
  bytes verifier = 1;
  bytes wrapped_key = 2;
}

message SetRecoveryResponse {}

message RecoverRequest {
  bytes verifier = 1;
}

message RecoverResponse {
  bytes wrapped_key = 1;
}

message SearchUsersRequest {
  string query = 1;
}

message User {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string bio = 4;
  // Changes whenever the photo changes; empty: no photo.
  string avatar_id = 5;
}

message SearchUsersResponse {
  repeated User users = 1;
}

message GetProfilesRequest {
  repeated string user_ids = 1;
}

message GetProfilesResponse {
  repeated User users = 1;
}

message UpdateProfileRequest {
  string display_name = 1;
  string bio = 2;
}

message UpdateProfileResponse {
  User user = 1;
}

message SetUsernameRequest {
  string username = 1;
}

message SetUsernameResponse {
  User user = 1;
}

message SetAvatarRequest {
  bytes image = 1;
}

message SetAvatarResponse {
  User user = 1;
}

message GetAvatarRequest {
  string user_id = 1;
}

message GetAvatarResponse {
  string avatar_id = 1;
  bytes image = 2;
}

message GetIceServersRequest {}
message IceServer {
  repeated string urls = 1;
  string username = 2;
  string credential = 3;
}
message GetIceServersResponse {
  repeated IceServer servers = 1;
}
