name: ci

on:
  push:
  pull_request:
  # Actions → ci → "Run workflow": build and release without a push.
  workflow_dispatch:

# Every build is versioned 1.0.<run number>; the apps trust update manifests
# signed with the key whose public part is the repository variable
# UPDATE_PUBLIC_KEY (create the keys with deploy/release-keys.sh).
env:
  KANTRA_BUILD: ${{ github.run_number }}
  KANTRA_VERSION: 1.0.${{ github.run_number }}
  UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mls-ffi
      - run: make lint
      - run: make test
      - name: Build service images
        run: |
          for s in auth-service directory-service delivery-service history-service media-service s3init; do docker build --build-arg SERVICE=$s -t kantra-$s . ; done
          docker build -f deploy/caddy.Dockerfile -t kantra-caddy deploy
          docker run --rm -v $PWD/deploy:/etc/caddy:ro -e DOMAIN=chat.example.com -e ACME_EMAIL=ci@example.com kantra-caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mls-ffi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: System libraries (GTK4, WebKitGTK 6)
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
      - run: make mls-ffi
      - name: Type-check frontend
        working-directory: desktop/frontend
        run: npm ci && npx svelte-check --tsconfig ./tsconfig.json
      - name: Version and update key
        run: .github/preset-version.sh
      - name: Build web (server mode) and desktop
        working-directory: desktop
        run: wails3 task build:server && wails3 task build
      - uses: actions/upload-artifact@v4
        with:
          name: kantra-linux-amd64
          path: desktop/bin/kantra-desktop

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc make
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mls-ffi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
      - name: MLS library (Rust, GNU target)
        run: cd mls-ffi && cargo build --release --target x86_64-pc-windows-gnu
      - name: MLS bridge tests on Windows
        env:
          CGO_ENABLED: "1"
        run: go test ./client/mls ./client/crypto
      - name: Preset the server address (repository variable KANTRA_SERVER, optional)
        if: ${{ vars.KANTRA_SERVER != '' }}
        shell: bash
        run: printf 'package main\n\nfunc init() { buildServer = "%s" }\n' "${{ vars.KANTRA_SERVER }}" > desktop/server_preset_ci.go
      - name: Version and update key
        shell: bash
        run: .github/preset-version.sh
      - name: Build desktop exe
        env:
          CGO_ENABLED: "1"
        run: cd desktop && "$(go env GOPATH)/bin/wails3" task build CGO_ENABLED=1
      - uses: actions/upload-artifact@v4
        with:
          name: kantra-windows-amd64
          path: desktop/bin/kantra-desktop.exe

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mls-ffi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: System libraries (the wails3 CLI links GTK4 / WebKitGTK 6)
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
      - name: MLS library (Rust, Android)
        run: make mls-ffi-android
      - name: Preset the server address (repository variable KANTRA_SERVER, optional)
        if: ${{ vars.KANTRA_SERVER != '' }}
        shell: bash
        run: printf 'package main\n\nfunc init() { buildServer = "%s" }\n' "${{ vars.KANTRA_SERVER }}" > desktop/server_preset_ci.go
      - name: Version and update key
        shell: bash
        run: .github/preset-version.sh
      # The runner ships the Android SDK and NDK (ANDROID_HOME, ANDROID_NDK_HOME).
      # Release key from the secrets (deploy/release-keys.sh); without them
      # the public test key signs the APK (and it is left out of releases).
      - name: Android release key
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/kantra-release.p12"
            { echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/kantra-release.p12"
              echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
              echo "ANDROID_KEY_PASSWORD=$KS_PASS"
              echo "ANDROID_KEY_ALIAS=kantra"; } >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with the public test key"
          fi
      - name: Build APK (arm64, release)
        run: make android
      - uses: actions/upload-artifact@v4
        with:
          name: kantra-android-arm64
          path: desktop/bin/kantra-desktop.apk

  macos:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mls-ffi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
      - run: make mls-ffi
      - name: MLS bridge tests on macOS
        run: go test ./client/mls ./client/crypto
      - name: Preset the server address (repository variable KANTRA_SERVER, optional)
        if: ${{ vars.KANTRA_SERVER != '' }}
        shell: bash
        run: printf 'package main\n\nfunc init() { buildServer = "%s" }\n' "${{ vars.KANTRA_SERVER }}" > desktop/server_preset_ci.go
      - name: Version and update key
        shell: bash
        run: .github/preset-version.sh
      - name: Build Kantra.app (arm64, ad-hoc signed)
        run: |
          set -o pipefail
          cd desktop && "$(go env GOPATH)/bin/wails3" task darwin:package 2>&1 | tee ../build.log
      - name: Show build errors
        if: failure()
        run: grep -v "^\s*$" build.log | grep -iv "could not import C" | tail -40 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Zip
        run: cd desktop/bin && mv kantra-desktop.app Kantra.app && ditto -c -k --keepParent Kantra.app Kantra-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kantra-macos-arm64
          path: desktop/bin/Kantra-macos-arm64.zip

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mls-ffi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
      - name: Preset the server address (repository variable KANTRA_SERVER, optional)
        if: ${{ vars.KANTRA_SERVER != '' }}
        shell: bash
        run: printf 'package main\n\nfunc init() { buildServer = "%s" }\n' "${{ vars.KANTRA_SERVER }}" > desktop/server_preset_ci.go
      - name: Version and update key
        shell: bash
        run: .github/preset-version.sh
      # Unsigned device build: re-signed on install with your Apple ID
      # (Sideloadly / AltStore) — see DEPLOY.md. Signing in CI would need
      # your Apple certificate and provisioning profile as secrets.
      - name: Build Kantra.ipa (iPhone, unsigned)
        run: |
          set -o pipefail
          make mls-ffi-ios IOS_PLATFORM=device 2>&1 | tee build.log
          cd desktop && "$(go env GOPATH)/bin/wails3" task ios:package:ipa IOS_PLATFORM=device CODESIGN_IDENTITY=- 2>&1 | tee -a ../build.log
          mv bin/kantra-desktop.ipa bin/Kantra.ipa
      - name: Show build errors
        if: failure()
        run: grep -v "^\s*$" build.log | grep -iv "could not import C" | tail -40 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: kantra-ios
          path: desktop/bin/Kantra.ipa
      - name: Build for the iOS Simulator (check)
        run: |
          make mls-ffi-ios IOS_PLATFORM=simulator
          cd desktop && "$(go env GOPATH)/bin/wails3" task ios:package IOS_PLATFORM=simulator

  # Every push to the default branch becomes a release the apps update
  # from (desktop/update.go): the files, latest.json signed with the update
  # key, and the AltStore / SideStore source for the iPhone app.
  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch
    needs: [test, desktop, windows, android, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Keys present?
        id: keys
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ] || [ -z "$UPDATE_PUBLIC_KEY" ]; then
            echo "::warning::No release: set the secret UPDATE_SIGNING_KEY and the variable UPDATE_PUBLIC_KEY (deploy/release-keys.sh)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.keys.outputs.ok == 'true'
        with:
          path: artifacts
      - name: Collect the apps
        if: steps.keys.outputs.ok == 'true'
        run: |
          mkdir dist
          cp artifacts/kantra-windows-amd64/kantra-desktop.exe dist/Kantra-windows-amd64.exe
          cp artifacts/kantra-linux-amd64/kantra-desktop dist/Kantra-linux-amd64
          cp artifacts/kantra-macos-arm64/Kantra-macos-arm64.zip dist/
          cp artifacts/kantra-ios/Kantra.ipa dist/
          if [ "$HAS_ANDROID_KEY" = "true" ]; then
            cp artifacts/kantra-android-arm64/kantra-desktop.apk dist/Kantra-android-arm64.apk
          else
            echo "::warning::Android left out: no release key (ANDROID_KEYSTORE_BASE64)"
          fi
          ls -l dist
      - name: Sign latest.json
        if: steps.keys.outputs.ok == 'true'
        run: go run ./tools/release -dir dist -version "$KANTRA_VERSION" -build "$KANTRA_BUILD" -repo "$GITHUB_REPOSITORY"
      - name: Publish
        if: steps.keys.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          gh release create "v$KANTRA_VERSION" dist/* --title "Kantra $KANTRA_VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
